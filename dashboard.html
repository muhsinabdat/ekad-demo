<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Papan pemuka · Aisyah & Hakim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee; --card: #ffffff; --ink: #1f2a25; --muted: #6b746f; --faint: #9aa29d; --line: #e7e3da;
    --em: #1f4d3d; --em-soft: #e8f1ec; --gold: #b38b4d;
    --warn: #8a5a12; --warn-bg: #fbf0dc; --bad: #9b3328; --bad-bg: #f9e6e3; --ok: #22684c; --ok-bg: #e3f2ea;
    --blue: #2d5f8a; --blue-bg: #e6eff7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 'Jost', system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 80px; }
  header { padding: 18px 0 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  header h1 { font: 400 34px/1 'Great Vibes', cursive; color: var(--em); margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .head-ctrls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .lang-toggle { display: flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang-toggle button { border: 0; background: transparent; font: 500 13px 'Jost', sans-serif; color: var(--muted); padding: 4px 11px; border-radius: 999px; cursor: pointer; }
  .lang-toggle button.on { background: var(--em); color: #fff; }
  select, input[type=text], input[type=search], textarea { font: 15px 'Jost', sans-serif; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
  textarea { min-height: 120px; resize: vertical; }
  .viewas { width: auto; font-size: 13px; padding: 6px 10px; }
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 4px; padding: 8px 0; overflow-x: auto; scrollbar-width: none; }
  nav button { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font: 500 14px 'Jost', sans-serif; color: var(--muted); cursor: pointer; }
  nav button.on { background: var(--em); border-color: var(--em); color: #fff; }
  nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--warn-bg); color: var(--warn); font-size: 12px; }
  nav .badge:empty { display: none; }
  nav button.on .badge { background: rgba(255,255,255,.2); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h3 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .metric { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .metric span { display: block; font-size: 13px; color: var(--muted); }
  .metric b { display: block; font-size: 28px; font-weight: 500; line-height: 1.2; }
  .metric b small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .metric em { display: block; font-style: normal; font-size: 12px; }
  .metric.warn { background: var(--warn-bg); border-color: #efdcb4; } .metric.warn span, .metric.warn b { color: var(--warn); }
  .metric.blue { background: var(--blue-bg); border-color: #cfe0ef; } .metric.blue span, .metric.blue b, .metric.blue em { color: var(--blue); }
  .bar { display: grid; grid-template-columns: 120px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
  .bar .track { height: 10px; background: #f0ede6; border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--em); border-radius: 5px; }
  .bar .fill.gold { background: var(--gold); }
  .bar b { text-align: right; font-weight: 500; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 12px; font: 500 14px 'Jost', sans-serif; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.pri { background: var(--em); border-color: var(--em); color: #fff; }
  .btn.wa { background: #e7f6ec; border-color: #bfe3cb; color: #17663a; }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn:active { transform: scale(.98); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .who { min-width: 0; }
  .row .who p { margin: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .who .sub { font-size: 12px; color: var(--faint); }
  .row .acts { display: flex; gap: 6px; flex-shrink: 0; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #f0ede6; color: var(--muted); margin-left: 4px; vertical-align: 1px; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.blue { background: var(--blue-bg); color: var(--blue); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
  .chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font: 13px 'Jost', sans-serif; color: var(--muted); cursor: pointer; }
  .chips button.on { border-color: var(--em); color: var(--em); background: var(--em-soft); font-weight: 500; }
  .confirm { background: var(--blue-bg); border-color: #cfe0ef; }
  .confirm p { margin: 0 0 10px; }
  .confirm .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .digest { background: var(--em); color: #f3efe4; border: 0; }
  .digest h3 { color: #fff; display: block; } .digest h3 small { color: #cfe0d6; display: block; margin-top: 2px; }
  .digest p { margin: 4px 0; font-size: 14px; }
  .inline-form { background: #faf8f4; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 0 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .inline-form .full { grid-column: 1 / -1; }
  .msg { background: #faf8f4; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; margin: 8px 0; max-height: 200px; overflow: auto; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 18px 0; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(40px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .25s; z-index: 50; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .flash { animation: flash 2s ease; }
  @keyframes flash { 0% { background: #fff6d8; } 100% { background: transparent; } }
  .demo-bar { background: #fff8e6; border-bottom: 1px solid #ecdcb5; font-size: 13px; text-align: center; padding: 8px 12px; color: #6b5420; }
  .demo-bar a, .demo-bar button { color: var(--em); font-weight: 500; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
  input[type=number] { font: 15px 'Jost', sans-serif; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 100%; }
  .linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--em); text-decoration: underline; cursor: pointer; }
  .bk-num { margin: 0 0 8px; font-size: 15px; color: var(--muted); }
  .bk-num b { font-size: 28px; font-weight: 500; color: var(--ink); }
  .track.big { height: 14px; border-radius: 7px; background: #f0ede6; overflow: hidden; }
  .track.big .fill { height: 100%; background: var(--em); border-radius: 7px; transition: width .4s; }
  .booked.near .fill { background: #c98a1c; } .booked.over .fill { background: var(--bad); }
  .bk-warn { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; font-size: 14px; background: var(--warn-bg); color: var(--warn); }
  .bk-warn.bad { background: var(--bad-bg); color: var(--bad); }
  .err { color: var(--bad); font-size: 13px; margin: 0; }
  @media (max-width: 400px) { .bar { grid-template-columns: 96px 1fr 34px; } }
</style>
</head>
<body>
<div class="demo-bar" data-i18n="demo_dash"></div>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Aisyah &amp; Hakim</h1>
      <p id="subtitle"></p>
    </div>
    <div class="head-ctrls">
      <div class="lang-toggle" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="ms">BM</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <select class="viewas" id="viewas" data-i18n-aria="view_as"></select>
    </div>
  </header>

  <nav id="tabs">
    <button data-t="home" class="on"><span data-i18n="tab_home"></span></button>
    <button data-t="done"><span data-i18n="tab_done"></span></button>
    <button data-t="wait"><span data-i18n="tab_wait"></span> <span class="badge" id="b-wait"></span></button>
    <button data-t="guests"><span data-i18n="tab_guests"></span></button>
    <button data-t="msgs"><span data-i18n="tab_msgs"></span></button>
  </nav>

  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  let db = loadDB();
  let tab = 'home', viewAs = '', doneFilter = 'all', search = '', bkEdit = false, openForm = null, flashId = null;
  try { tab = sessionStorage.getItem('dashTab') || 'home'; } catch (e) {}

  function fillViewAs() {
    $('viewas').innerHTML = `<option value="">${esc(t('view_all'))}</option>` +
      LISTS.map(l => `<option value="${l.key}">${esc(t('view_list', listShort(l.key)))}</option>`).join('');
    $('viewas').value = viewAs;
  }
  $('viewas').onchange = e => { viewAs = e.target.value; render(); };

  function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200); }
  function copy(text, msg) {
    msg = msg || t('copied');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(msg))
      .catch(() => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg); });
  }
  const save = () => saveDB(db);
  const invOf = r => r.invitedId && db.invited.find(i => i.id === r.invitedId);
  const listOfReply = r => { const i = invOf(r); return i ? i.list : (r.dari || ''); };

  // ---------- views ----------
  function header() {
    const tt = totals(db, viewAs);
    $('subtitle').textContent = `${L(WEDDING.dateText)} · ${t('days_left', daysToGo())}`;
    $('b-wait').textContent = tt.waiting || '';
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    const on = document.querySelector('#tabs .on');
    if (on) on.parentNode.scrollLeft = on.offsetLeft - 40;
    return tt;
  }

  function pendingCards() {
    const p = db.replies.filter(r => r.status === 'pending' && (!viewAs || r.dari === viewAs || (r.candidates || []).some(c => (db.invited.find(i => i.id === c) || {}).list === viewAs)));
    return p.map(r => {
      const cands = (r.candidates || []).map(c => db.invited.find(i => i.id === c)).filter(i => i && !i.replyId);
      return `<div class="card confirm">
        <p>${t('confirm_q', esc(r.name), r.attend ? r.pax + ' pax' : t('not_attending'), r.dari ? esc(listShort(r.dari)) : '')}</p>
        <div class="opts">
          ${cands.map(i => `<button class="btn sm pri" data-link="${r.id}|${i.id}">${esc(i.name)} <span style="opacity:.75">· ${esc(listShort(i.list))}</span></button>`).join('')}
          <button class="btn sm" data-extra="${r.id}">${t('not_them')}</button>
        </div></div>`;
    }).join('');
  }

  function vHome(tt) {
    const day = Date.now() - 86400000;
    const fresh = db.replies.filter(r => r.at > day).sort((a, b) => b.at - a.at);
    const maxSlot = Math.max(1, ...Object.values(tt.slots));
    const sideEntries = Object.entries(tt.bySide).sort((a, b) => b[1] - a[1]);
    const maxSide = Math.max(1, ...sideEntries.map(e => e[1]));
    const wishes = db.replies.filter(r => r.wish).sort((a, b) => b.at - a.at).slice(0, 3);
    const names = fresh.slice(0, 4).map(r => esc(r.name)).join(', ') + (fresh.length > 4 ? '…' : '');
    const all = totals(db, '');
    const booked = db.settings.bookedPax;
    return `
      <div class="card digest">
        <h3>${t('digest_title')} <small>${t('digest_sub')}</small></h3>
        <p>${fresh.length ? t('digest_new', fresh.length, names) : t('digest_none')}</p>
        <p>${t('digest_wait', tt.waiting, tt.pending)}</p>
        ${all.pax >= booked * .9 ? `<p>⚠ ${t('digest_near', all.pax, booked)}</p>` : ''}
      </div>
      ${pendingCards()}
      ${bookedCard(all, booked)}
      ${dayCard()}
      <div class="grid">
        <button class="metric" data-go="done" data-f="yes"><span>${t('m_yes')}</span><b>${tt.pax} <small>${t('m_yes_sub', tt.yes)}</small></b></button>
        <button class="metric" data-go="done" data-f="no"><span>${t('m_no')}</span><b>${tt.no}</b></button>
        <button class="metric warn" data-go="wait"><span>${t('m_wait')}</span><b>${tt.waiting} <small>${t('m_wait_sub', tt.invited)}</small></b></button>
        <button class="metric blue" data-go="done" data-f="extra"><span>${t('m_extra')}</span><b>${tt.extra}</b><em>${t('m_extra_sub')}</em></button>
      </div>
      <div class="card">
        <h3>${t('c_slots')} <small>${t('pax')}</small></h3>
        ${WEDDING.slots.map(s => `<div class="bar"><span>${esc(L(s.label))}</span><div class="track"><div class="fill" style="width:${(tt.slots[s.key] || 0) / maxSlot * 100}%"></div></div><b>${tt.slots[s.key] || 0}</b></div>`).join('')}
      </div>
      <div class="card">
        <h3>${t('c_side')} <small>${t('c_side_sub')}</small></h3>
        ${sideEntries.length ? sideEntries.map(([k, v]) => `<div class="bar"><span>${esc(listShort(k))}</span><div class="track"><div class="fill gold" style="width:${v / maxSide * 100}%"></div></div><b>${v}</b></div>`).join('') : `<div class="empty">${t('none_yet')}</div>`}
      </div>
      <div class="card">
        <h3>${t('c_wishes')} <small>${t('c_wishes_sub', db.replies.filter(r => r.wish).length)}</small></h3>
        ${wishes.length ? wishes.map(r => `<div class="row"><div class="who"><p>${esc(r.wish)}</p><p class="sub">— ${esc(r.name)} · ${timeAgo(r.at)}</p></div></div>`).join('') : `<div class="empty">${t('wishes_empty')}</div>`}
      </div>`;
  }

  // Confirmed pax against what the couple booked with the caterer (always all lists — the booking is for the whole majlis).
  function bookedCard(all, booked) {
    const left = booked - all.pax;
    const state = left < 0 ? 'over' : (all.pax >= booked * .85 ? 'near' : '');
    const pct = Math.min(100, all.pax / booked * 100);
    return `<div class="card booked ${state}">
      <h3>${t('bk_title')} <small>${t('bk_sub')} · <button class="linkbtn" data-bk-edit>${t('bk_edit')}</button></small></h3>
      <p class="bk-num">${t('bk_of', all.pax, booked)}</p>
      <div class="track big" role="progressbar" aria-valuemin="0" aria-valuemax="${booked}" aria-valuenow="${all.pax}" aria-label="${esc(t('bk_title'))}"><div class="fill" style="width:${pct}%"></div></div>
      ${left >= 0 ? `<p class="small muted" style="margin:8px 0 0">${t('bk_left', left, all.waiting)}</p>` : ''}
      ${state === 'near' ? `<p class="bk-warn">${t('bk_near', left)}</p>` : ''}
      ${state === 'over' ? `<p class="bk-warn bad">${t('bk_over', -left)}</p>` : ''}
      ${bkEdit ? `<div class="inline-form" style="margin:12px 0 0">
        <label class="full small" for="bk-input">${t('bk_label')}</label>
        <input type="number" id="bk-input" min="1" step="1" inputmode="numeric" value="${booked}">
        <div style="display:flex;gap:6px"><button class="btn sm pri" data-bk-save>${t('save')}</button><button class="btn sm" data-bk-cancel>${t('cancel')}</button></div>
        <p class="err full" id="bk-err"></p>
      </div>` : ''}
    </div>`;
  }

  // Wedding-day updates: one tap posts a note that appears at the top of the guests' card.
  function dayCard() {
    const ups = (db.updates || []).slice().sort((a, b) => b.at - a.at);
    return `<div class="card">
      <h3>${t('dd_title')} <small>${t('dd_sub')}</small></h3>
      <p class="small muted" style="margin:-4px 0 10px">${t('dd_note')}</p>
      <div class="chips" style="margin-top:0">${t('dd_presets').map((p, k) => `<button data-preset="${k}">${esc(p)}</button>`).join('')}</div>
      <div style="display:flex;gap:8px;margin:8px 0 4px">
        <input type="text" id="upd-text" placeholder="${esc(t('dd_custom_ph'))}" maxlength="140">
        <button class="btn pri" data-post>${t('dd_post')}</button>
      </div>
      ${ups.length ? ups.slice(0, 5).map(u => `<div class="row"><div class="who"><p>${esc(updateText(u))}</p><p class="sub">${timeAgo(u.at)}</p></div>
        <div class="acts"><button class="btn sm" data-del-upd="${u.id}">${t('dd_delete')}</button></div></div>`).join('') : `<div class="empty">${t('dd_none')}</div>`}
      <a class="btn" style="margin-top:8px" href="index.html?hari=1" target="_blank">${t('dd_preview')}</a>
    </div>`;
  }

  function vDone() {
    let reps = db.replies.filter(r => r.status !== 'pending' && (!viewAs || listOfReply(r) === viewAs));
    if (doneFilter === 'yes') reps = reps.filter(r => r.attend);
    if (doneFilter === 'no') reps = reps.filter(r => !r.attend);
    if (doneFilter === 'extra') reps = reps.filter(r => r.status === 'extra');
    if (search) { const q = search.toLowerCase(); reps = reps.filter(r => r.name.toLowerCase().includes(q) || ((invOf(r) || {}).name || '').toLowerCase().includes(q)); }
    reps.sort((a, b) => b.at - a.at);
    const chip = (k, key) => `<button data-f="${k}" class="${doneFilter === k ? 'on' : ''}">${t(key)}</button>`;
    return `${pendingCards()}
      <div class="card">
        <input type="search" id="search" placeholder="${esc(t('search_ph'))}" value="${esc(search)}">
        <div class="chips" id="chips">${chip('all', 'f_all')}${chip('yes', 'f_yes2')}${chip('no', 'f_no2')}${chip('extra', 'f_extra')}</div>
        ${reps.length ? reps.map(r => {
          const inv = invOf(r);
          const known = inv && coreTokens(inv.name).join(' ') !== coreTokens(r.name).join(' ');
          return `<div class="row ${r.id === flashId ? 'flash' : ''}"><div class="who">
            <p>${esc(r.name)}${r.attend ? ` <span class="pill ok">${r.pax} pax</span>` : ` <span class="pill bad">${t('p_no')}</span>`}${r.status === 'extra' ? ` <span class="pill blue">${t('p_extra')}</span>` : ''}</p>
            <p class="sub">${known ? t('listed_as', esc(inv.name)) : ''}${esc(listShort(listOfReply(r)))} · ${r.attend ? esc(slotLabel(r.slot)) + ' · ' : ''}${timeAgo(r.at)}${r.manual ? t('manual_rec') : ''}</p>
          </div></div>`;
        }).join('') : `<div class="empty">${t('no_match')}</div>`}
      </div>`;
  }

  function vWait() {
    const lists = LISTS.filter(l => !viewAs || l.key === viewAs);
    const blocks = lists.map(l => {
      const s = listShort(l.key);
      const waiting = db.invited.filter(i => i.list === l.key && !i.replyId);
      if (!waiting.length) return `<div class="card"><h3>${esc(t('list_title', s))} <small>${t('all_replied')}</small></h3></div>`;
      return `<div class="card">
        <h3>${esc(t('list_title', s))} <small>${t('n_waiting', waiting.length)}</small></h3>
        <p class="small muted" style="margin:-4px 0 10px">${esc(t('list_note', s))}</p>
        <a class="btn wa" style="width:100%;margin-bottom:8px" target="_blank" rel="noopener" data-remind-list="${l.key}" href="${waLink(t('wa_list', l.key, waiting.map(i => i.name)))}">${esc(t('send_list_to', s))}</a>
        ${waiting.map(i => `
          <div class="row"><div class="who"><p>${esc(i.name)}</p>
            <p class="sub">${i.reminded ? t('reminded', i.reminded, timeAgo(i.lastReminded)) : t('not_reminded')}${i.phone ? t('has_phone') : ''}</p></div>
            <div class="acts">
              ${i.phone ? `<a class="btn sm wa" target="_blank" rel="noopener" data-remind="${i.id}" href="${waLink(t('wa_personal', i.name, i.list), i.phone)}" aria-label="${esc(t('remind_aria', i.name))}">${t('remind')}</a>` : ''}
              <button class="btn sm" data-manual="${i.id}">${t('mark_replied')}</button>
            </div></div>
          ${openForm === i.id ? manualForm(i) : ''}`).join('')}
      </div>`;
    }).join('');
    return `<p class="small muted" style="margin:12px 0 0">${t('wait_note')}</p>${blocks}`;
  }

  function manualForm(i) {
    return `<div class="inline-form" data-form="${i.id}">
      <p class="full small" style="margin:0">${esc(t('manual_title', i.name))}</p>
      <select data-k="attend"><option value="yes">${t('f_yes2')}</option><option value="no">${t('f_no2')}</option></select>
      <select data-k="pax">${Array.from({ length: WEDDING.maxPax }, (_, n) => `<option>${n + 1}</option>`).join('')}</select>
      <select data-k="slot" class="full">${WEDDING.slots.map(s => `<option value="${s.key}">${esc(L(s.label))}</option>`).join('')}</select>
      <button class="btn sm pri" data-save="${i.id}">${t('save')}</button><button class="btn sm" data-cancel>${t('cancel')}</button>
    </div>`;
  }

  function vGuests() {
    const counts = LISTS.map(l => ({ l, n: db.invited.filter(i => i.list === l.key).length }));
    const hasPicker = 'contacts' in navigator && 'select' in navigator.contacts;
    const list = db.invited.filter(i => !viewAs || i.list === viewAs);
    return `
      <div class="card">
        <h3>${t('add_title')} <small>${t('add_sub')}</small></h3>
        <p class="small muted" style="margin:0 0 8px">${t('add_note')}</p>
        <textarea id="paste" placeholder="${esc(t('add_ph'))}"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <select id="addlist" style="flex:1;min-width:150px">${LISTS.map(l => `<option value="${l.key}" ${viewAs === l.key ? 'selected' : ''}>${esc(t('list_title', listShort(l.key)))}</option>`).join('')}</select>
          <button class="btn pri" id="add">${t('add_btn')}</button>
          ${hasPicker ? `<button class="btn" id="pick">${t('pick')}</button>` : ''}
        </div>
        ${hasPicker ? '' : `<p class="small muted" style="margin:8px 0 0">${t('pick_note')}</p>`}
      </div>
      <div class="card">
        <h3>${t('links_title')}</h3>
        <p class="small muted" style="margin:-4px 0 6px">${t('links_note')}</p>
        ${counts.map(({ l, n }) => `<div class="row"><div class="who"><p>${esc(t('list_title', listShort(l.key)))} <span class="pill">${t('n_names', n)}</span></p><p class="sub">${esc(cardUrl(l.key))}</p></div>
          <div class="acts"><button class="btn sm" data-copylink="${l.key}">${t('copy')}</button></div></div>`).join('')}
      </div>
      <div class="card">
        <h3>${t('all_names')} <small>${list.length}</small></h3>
        ${list.map(i => `<div class="row"><div class="who"><p>${esc(i.name)} ${i.replyId ? `<span class="pill ok">${t('replied')}</span>` : `<span class="pill">${t('not_yet')}</span>`}</p><p class="sub">${esc(t('list_title', listShort(i.list)))}${i.phone ? ' · ' + esc(i.phone) : ''}</p></div>
          <div class="acts"><button class="btn sm" data-del="${i.id}" aria-label="${esc(t('remove_aria', i.name))}">${t('remove')}</button></div></div>`).join('')}
      </div>`;
  }

  function vMsgs(tt) {
    const yesPhones = db.replies.filter(r => r.attend && normPhone(r.phone)).length;
    const msg = (title, sub, text, extra = '') => `<div class="card"><h3>${title} <small>${sub}</small></h3><div class="msg">${esc(text)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn wa" target="_blank" rel="noopener" href="${waLink(text)}">${t('open_wa')}</a><button class="btn" data-copytext="${encodeURIComponent(text)}">${t('copy')}</button>${extra}</div></div>`;
    const list = viewAs || 'mak';
    return `
      <p class="small muted" style="margin:12px 0 0">${t('msgs_note')}</p>
      ${msg(t('msg_card'), esc(t('msg_card_sub', listShort(list))), t('wa_card', list))}
      ${msg(t('msg_tmr'), t('msg_tmr_sub'), t('wa_tomorrow'), `<span class="small muted" style="align-self:center">${t('msg_tmr_phones', yesPhones)}</span>`)}`;
  }

  // A reply waiting for confirmation whose suggested names have all been taken is just an extra guest.
  function tidyPending() {
    let changed = false;
    db.replies.filter(r => r.status === 'pending').forEach(r => {
      if (!(r.candidates || []).some(c => { const i = db.invited.find(x => x.id === c); return i && !i.replyId; })) {
        r.status = 'extra'; delete r.candidates; changed = true;
      }
    });
    if (changed) save();
  }

  function render() {
    tidyPending();
    const tt = header();
    const v = { home: vHome, done: vDone, wait: vWait, guests: vGuests, msgs: vMsgs }[tab] || vHome;
    $('view').innerHTML = v(tt);
    const s = $('search');
    if (s) { s.oninput = e => { search = e.target.value; const pos = e.target.selectionStart; render(); const n = $('search'); n.focus(); n.setSelectionRange(pos, pos); }; }
    if ($('add')) $('add').onclick = addNames;
    if ($('upd-text')) $('upd-text').onkeydown = e => { if (e.key === 'Enter') document.querySelector('[data-post]').click(); };
    if ($('bk-input')) $('bk-input').onkeydown = e => { if (e.key === 'Enter') document.querySelector('[data-bk-save]').click(); };
    if ($('pick')) $('pick').onclick = pickContacts;
    flashId = null;
  }

  function renderAll() {
    applyI18n();
    document.title = (LANG === 'en' ? 'Dashboard' : 'Papan pemuka') + ' · ' + WEDDING.bride + ' & ' + WEDDING.groom;
    fillViewAs();
    render();
  }

  // ---------- actions ----------
  function addNames() {
    const list = $('addlist').value;
    const lines = $('paste').value.split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (!lines.length) { toast(t('t_paste_one')); return; }
    let n = 0;
    lines.forEach(line => {
      const m = line.match(/^(.*?)[,\s]*((?:\+?65)?[\s-]*[689]\d{3}[\s-]?\d{4})?\s*$/);
      const name = (m ? m[1] : line).replace(/[,\-–]+$/, '').trim();
      const phone = m && m[2] ? m[2].replace(/\D/g, '') : '';
      if (name.length < 2) return;
      if (db.invited.some(i => i.list === list && i.name.toLowerCase() === name.toLowerCase())) return;
      db.invited.push({ id: uid(), name, list, phone, replyId: null, reminded: 0, lastReminded: null, addedAt: Date.now() });
      n++;
    });
    // a newly added name may match an earlier reply that was treated as an extra guest
    db.replies.filter(r => r.status === 'extra' && !r.dismissed).forEach(r => {
      const m = matchReply(db, r);
      if (m.status === 'matched') linkReply(db, r.id, m.invitedId);
      else if (m.status === 'pending') { r.status = 'pending'; r.candidates = m.candidates; }
    });
    save(); toast(t('t_added', n, listShort(list))); render();
  }

  async function pickContacts() {
    try {
      const cs = await navigator.contacts.select(['name', 'tel'], { multiple: true });
      const list = $('addlist').value;
      cs.forEach(c => {
        const name = (c.name && c.name[0]) || ''; if (!name) return;
        db.invited.push({ id: uid(), name, list, phone: (c.tel && c.tel[0]) || '', replyId: null, reminded: 0, lastReminded: null, addedAt: Date.now() });
      });
      save(); toast(t('t_contacts', cs.length)); render();
    } catch (e) { toast(t('t_pick_cancel')); }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('button, a'); if (!el) return;
    const d = el.dataset;
    if (d.lang) { setLang(d.lang); renderAll(); return; }
    if (el.id === 'reset') { db = resetDB(); tab = 'home'; toast(t('t_reset')); render(); return; }
    if (el.closest('#tabs')) { tab = d.t; try { sessionStorage.setItem('dashTab', tab); } catch (x) {} openForm = null; render(); window.scrollTo(0, 0); return; }
    if (d.go) { tab = d.go; if (d.f) doneFilter = d.f; render(); window.scrollTo(0, 0); return; }
    if (el.closest('#chips')) { doneFilter = d.f; render(); return; }
    if (d.link) { const [r, i] = d.link.split('|'); linkReply(db, r, i); save(); flashId = r; toast(t('t_matched')); render(); return; }
    if (d.extra) { const r = db.replies.find(x => x.id === d.extra); r.status = 'extra'; r.dismissed = true; delete r.candidates; save(); toast(t('t_new_guest')); render(); return; }
    if (d.remind) { const i = db.invited.find(x => x.id === d.remind); i.reminded++; i.lastReminded = Date.now(); save(); setTimeout(render, 300); return; }
    if (d.remindList) { db.invited.filter(i => i.list === d.remindList && !i.replyId).forEach(i => { i.reminded++; i.lastReminded = Date.now(); }); save(); setTimeout(render, 300); return; }
    if (d.manual) { openForm = openForm === d.manual ? null : d.manual; render(); return; }
    if ('cancel' in d) { openForm = null; render(); return; }
    if (d.save) {
      const f = document.querySelector(`[data-form="${d.save}"]`);
      const get = k => f.querySelector(`[data-k="${k}"]`).value;
      const i = db.invited.find(x => x.id === d.save);
      const yes = get('attend') === 'yes';
      const r = { id: uid(), name: i.name, phone: i.phone, attend: yes, pax: yes ? +get('pax') : 0, slot: yes ? get('slot') : '', dari: i.list, wish: '', at: Date.now(), manual: true, status: 'matched', invitedId: i.id };
      db.replies.push(r); i.replyId = r.id; openForm = null; save(); toast(t('recorded', i.name)); render(); return;
    }
    if (d.del) { const k = db.invited.findIndex(x => x.id === d.del); const i = db.invited[k]; if (i.replyId) { const r = db.replies.find(x => x.id === i.replyId); if (r) { r.status = 'extra'; delete r.invitedId; } } db.invited.splice(k, 1); save(); toast(t('t_removed')); render(); return; }
    if (d.copylink) { copy(cardUrl(d.copylink), t('t_link_copied')); return; }
    if (d.copytext) { copy(decodeURIComponent(d.copytext)); return; }
    if (d.preset != null || 'post' in d) {
      const text = 'post' in d ? $('upd-text').value.trim() : null;
      if ('post' in d && !text) { $('upd-text').focus(); return; }
      db.updates = db.updates || [];
      db.updates.push(text ? { id: uid(), text, at: Date.now() } : { id: uid(), preset: +d.preset, at: Date.now() });
      save(); toast(t('dd_posted')); render(); return;
    }
    if (d.delUpd) { db.updates = db.updates.filter(u => u.id !== d.delUpd); save(); render(); return; }
    if ('bkEdit' in d) { bkEdit = !bkEdit; render(); if (bkEdit) $('bk-input').focus(); return; }
    if ('bkCancel' in d) { bkEdit = false; render(); return; }
    if ('bkSave' in d) {
      const v = Math.round(+$('bk-input').value);
      if (!(v >= 1 && v <= 100000)) { $('bk-err').textContent = t('bk_err'); return; }
      db.settings.bookedPax = v; bkEdit = false; save(); toast(t('bk_saved')); render(); return;
    }
  });

  // live updates: a guest submitting the card in another tab shows up here immediately
  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY) return;
    const before = new Set(db.replies.map(r => r.id));
    db = loadDB();
    const fresh = db.replies.find(r => !before.has(r.id));
    if (fresh) { flashId = fresh.id; toast(t('t_new_reply', fresh.name)); }
    render();
  });

  renderAll();
})();
</script>
</body>
</html>
